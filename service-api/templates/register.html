{% extends "base.html" %}

{% block title %}Inscription - Service A{% endblock %}

{% block content %}
<h1>Inscription</h1>
<form id="register-form">
    <div>
        <label>Email:</label>
        <input type="email" id="email" required>
    </div>
    <div>
        <label>Nom d'utilisateur:</label>
        <input type="text" id="username" required>
    </div>
    <div>
        <label>Mot de passe:</label>
        <input type="password" id="password" required>
    </div>
    <button type="submit">S'inscrire</button>
</form>
<div id="result"></div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
        email: document.getElementById('email').value,
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };
    
    document.getElementById('result').innerHTML = '<p>Inscription en cours...</p>';
    
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            document.getElementById('result').innerHTML = 
                '<p style="color:green">Inscription réussie ! Vous pouvez maintenant vous connecter.</p>';
            // Optionnel : rediriger vers login
            // setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
            document.getElementById('result').innerHTML = 
                `<p style="color:red">Erreur : ${result.detail || 'Inconnue'}</p>`;
        }
    } catch (error) {
        document.getElementById('result').innerHTML = 
            '<p style="color:red">Erreur réseau</p>';
    }
});
</script>
{% endblock %}
