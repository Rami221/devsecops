apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-honeypot
  labels:
    app: service-honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-honeypot
  template:
    metadata:
      labels:
        app: service-honeypot
    spec:
      containers:
      - name: honeypot
        image: service-honeypot:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: service-honeypot
spec:
  selector:
    app: service-honeypot
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
