apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-honeypot
  labels:
    app: ssh-honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh-honeypot
  template:
    metadata:
      labels:
        app: ssh-honeypot
    spec:
      containers:
      - name: cowrie
        image: cowrie/cowrie:latest
        ports:
        - containerPort: 2222

---
apiVersion: v1
kind: Service
metadata:
  name: ssh-honeypot-service
spec:
  selector:
    app: ssh-honeypot
  ports:
    - port: 22
      targetPort: 2222
  type: ClusterIP
