apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  labels:
    app: service-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-api
  template:
    metadata:
      labels:
        app: service-api
    spec:
      initContainers:
      - name: init-db
        image: python:3.9-slim
        command:
        - sh
        - -c
        - |
          mkdir -p /data
          chmod 777 /data
          touch /data/app.db
          chmod 666 /data/app.db
        volumeMounts:
        - name: sqlite-storage
          mountPath: /data
      containers:
      - name: api
        image: service-api:v23
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: sqlite-storage
          mountPath: /data
      volumes:
      - name: sqlite-storage
        persistentVolumeClaim:
          claimName: sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: service-api
spec:
  selector:
    app: service-api
  ports:
  - port: 80
    targetPort: 8000
  type: NodePort
